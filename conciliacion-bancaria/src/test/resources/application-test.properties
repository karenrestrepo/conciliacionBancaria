spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/conciliacion_test}
spring.datasource.username=${DB_USER:test}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA - validate porque Flyway ya crea el schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# Flyway activo en tests (aplica migraciones si hace falta)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT - clave de desarrollo (suficiente para tests)
jwt.secret=dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration-ms=28800000

# Logs silenciosos en tests
logging.level.com.conciliacion=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN