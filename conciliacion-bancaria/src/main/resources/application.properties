# ── Servidor ─────────────────────────────────────────────
server.port=8080

# ── Base de datos ─────────────────────────────────────────
# En local usamos variables de entorno; en Docker se sobreescriben
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/conciliacion_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── HikariCP (connection pool) ────────────────────────────
# Formula TRD: (núcleos_CPU x 2) + 1
spring.datasource.hikari.maximum-pool-size=9
spring.datasource.hikari.connection-timeout=30000

# ── JWT ───────────────────────────────────────────────────
# En producción esto viene de Docker secrets; en local usa esta clave de desarrollo
jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
jwt.expiration-ms=28800000
jwt.refresh-expiration-ms=86400000

# ── Async (motor de conciliación) ─────────────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# ── Upload de archivos CSV ─────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logs estructurados JSON ────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.conciliacion=DEBUG
logging.level.org.springframework.security=WARN

# ── Feature flag (TRD §14.3) ──────────────────────────────
app.feature.conciliacion-module-enabled=${CONCILIACION_MODULE_ENABLED:true}
